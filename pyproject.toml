[project]
name = "rachacontas"
version = "0.1.0"
description = "Racha de contas do rolê"
readme = "README.md"
authors = [
    { name = "muliroZ", email = "murilomega100@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
rachacontas = "rachacontas:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
exclude = [
    ".git",
    ".pyenv",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
]

line-length = 100
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
