name: Pipeline CI
run-name: Mudanças feitas por ${{ github.actor }}

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Python CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12, 3.13, 3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: latest

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install deps
        run: uv sync --frozen

      - name: Lint
        run: ruff check
        continue-on-error: true